name: Pipeline CI

# Roda toda vez que um Pull Request for aberto ou atualizado
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  lint-and-test:
    name: Lint e Testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Verifica erros de sintaxe e estilo (lint)
      - name: Rodar lint (flake8)
        run: |
          # Falha o build se houver erros graves (sintaxe, nomes indefinidos etc.)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Mostra avisos de estilo sem quebrar o build
          flake8 . --count --exit-zero --max-line-length=127 --statistics

      # 5. Roda os testes automatizados (se existirem)
      - name: Rodar testes (pytest)
        run: |
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pytest -v
          else
            echo "Nenhum teste encontrado ainda — pulei essa etapa."
          fi